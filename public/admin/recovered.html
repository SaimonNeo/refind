<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Recovered items — ReFind</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
<script src="/js/ui.js"></script>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="/admin/dashboard.html" class="brand"><span class="mark"></span>ReFind <span class="badge" style="margin-left:8px;">Admin</span></a>
    <div class="nav-links">
      <span id="notif-area"></span>
      <a href="#" id="logout-link">Log out</a>
    </div>
  </div>
</nav>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <a href="/admin/dashboard.html">Overview</a>
    <a href="/admin/items.html">Items</a>
    <a href="/admin/claims.html">Claims</a>
    <a href="/admin/analytics.html">Analytics</a>
    <a href="/admin/recovered.html" class="active">Recovered</a>
    <a href="/admin/users.html">Users</a>
    <a href="/admin/audit-log.html">Audit log</a>
  </aside>
  <main class="admin-main">
    <h2>Recovered items</h2>
    <p class="muted mb-24">Everything that's been claimed or fully returned to its owner.</p>

    <div id="loading">Loading…</div>
    <div class="table-wrap" id="table-wrap" style="display:none;">
      <table class="admin-table" id="recovered-table">
        <thead><tr><th>Item</th><th>Reported by</th><th>Status</th><th>Reported</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="empty" class="empty-state" style="display:none;"><h3>Nothing recovered yet</h3><p>Approved claims and confirmed handovers will show up here.</p></div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/items.js"></script>
<script src="/js/notifications.js"></script>
<script>
  requireAdmin();
  document.getElementById('logout-link').addEventListener('click', (e) => { e.preventDefault(); logout(); });
  document.getElementById('notif-area').innerHTML = notifBellHtml();
  initNotifBell();

  async function load() {
    try {
      const { items } = await api.get('/admin/recovered');
      document.getElementById('loading').style.display = 'none';
      if (!items.length) {
        document.getElementById('empty').style.display = 'block';
        return;
      }
      const table = document.getElementById('recovered-table');
      table.style.display = 'table';
      document.getElementById('table-wrap').style.display = 'block';
      table.querySelector('tbody').innerHTML = items.map(i => `
        <tr>
          <td><a href="/item.html?id=${i.id}&from=admin" target="_blank" style="font-weight:600;">${escapeHtml(i.title)}</a></td>
          <td>
            <div style="display:flex; align-items:center; gap:8px;">
              ${renderUserAvatar(i.reporter_avatar, i.reporter_name, 'xs')}
              <div>
                <div style="font-weight:600; font-size:0.86rem;">${escapeHtml(i.reporter_name || '—')}</div>
                <div class="muted small">${escapeHtml(i.reporter_batch ? `Batch ${i.reporter_batch}${i.reporter_section ? ` (${i.reporter_section})` : ''}` : '')}</div>
              </div>
            </div>
          </td>
          <td><span class="badge ${statusBadgeClass(i.status)}">${i.status}</span></td>
          <td>${timeAgo(i.created_at)}</td>
          <td>
            <a href="/item.html?id=${i.id}&from=admin" target="_blank" class="btn btn-ghost btn-sm" title="View in new tab">View ↗</a>
            <a href="/receipt.html?itemId=${i.id}&from=admin&returnUrl=/admin/recovered.html" target="_blank" class="btn btn-outline btn-sm"><svg class="ui-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> Receipt</a>
          </td>
        </tr>
      `).join('');
    } catch (err) {
      document.getElementById('loading').innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
    }
  }
  load();
</script>
</body>
</html>
