<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Item Details — ReFind</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/ui.js"></script>
<style>
  .item-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 40px 0 80px; }
  .item-photo { aspect-ratio: 4/3; background: var(--paper-dim); border: 1px solid var(--line); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: var(--ink-soft); overflow: hidden; }
  .item-photo img { width: 100%; height: 100%; object-fit: cover; }
  .meta-list { display: grid; gap: 10px; margin: 20px 0; }
  .meta-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; font-size: 0.92rem; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .meta-row .k { color: var(--ink-soft); flex-shrink: 0; }
  .meta-row > *:last-child { text-align: right; word-break: break-word; }
  @media (max-width: 800px) {
    .item-detail { grid-template-columns: 1fr; gap: 28px; padding: 24px 0 48px; }
  }
  @media (max-width: 480px) {
    .item-detail { gap: 20px; padding: 16px 0 36px; }
    #actions { display: flex; flex-direction: column; width: 100%; gap: 10px; }
    #actions .btn { width: 100%; justify-content: center; min-height: 44px; }
    .meta-row { font-size: 0.85rem; padding: 6px 0; gap: 8px; }
  }
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="/index.html" class="brand"><span class="mark"></span>ReFind</a>
    <div class="nav-links">
      <a href="/browse.html">Browse</a>
      <span id="nav-auth-area"></span>
    </div>
  </div>
</nav>

<div class="container">
  <div id="admin-bar-area"></div>
  <div id="loading" class="text-center" style="padding:80px 0;">Loading item…</div>
  <div id="error-area"></div>
  <div id="item-detail" class="item-detail" style="display:none;"></div>
</div>

<footer class="footer"><div class="container">ReFind — campus lost &amp; found.</div></footer>

<script src="/js/api.js"></script>
<script src="/js/notifications.js"></script>
<script src="/js/items.js"></script>
<script>
  function renderNav() {
    const area = document.getElementById('nav-auth-area');
    const user = getUser();
    area.innerHTML = user
      ? `<a href="/dashboard.html" style="display:inline-flex; align-items:center; gap:6px;">${renderUserAvatar(user, user.name, 'xs')} Dashboard</a>${user.role === 'admin' ? ' <a href="/admin/dashboard.html" class="nav-admin-badge"><svg class="ui-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Admin</a>' : ''}${notifBellHtml()} <a href="#" id="logout-link">Log out</a>`
      : `<a href="/login.html">Log in</a> <a href="/register.html" class="btn btn-primary btn-sm">Sign up</a>`;
    const l = document.getElementById('logout-link');
    if (l) l.addEventListener('click', (e) => { e.preventDefault(); logout(); });
    if (user) initNotifBell();
  }
  renderNav();

  const params = new URLSearchParams(window.location.search);
  const itemId = params.get('id');
  const user = getUser();

  async function load() {
    if (!itemId) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-area').innerHTML = `<div class="alert alert-error">No item specified.</div>`;
      return;
    }
    try {
      const { item } = await api.get(`/items/${itemId}`);
      render(item);
    } catch (err) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-area').innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
    }
  }

  function render(item) {
    document.title = `${item.title} — ReFind`;
    document.getElementById('loading').style.display = 'none';

    const fromParamInit = params.get('from');
    const tabParamInit = params.get('tab') || sessionStorage.getItem('refind_dash_tab') || (item.type === 'found' ? 'found' : 'lost');
    const storedAdminPage = sessionStorage.getItem('refind_admin_last_page');
    let adminReturnUrl = storedAdminPage || '/admin/items.html';
    let adminReturnLabel = '← Back to Admin Items';
    if (adminReturnUrl.includes('dashboard.html')) adminReturnLabel = '← Back to Admin Dashboard';
    else if (adminReturnUrl.includes('claims.html')) adminReturnLabel = '← Back to Claims Desk';
    else if (adminReturnUrl.includes('recovered.html')) adminReturnLabel = '← Back to Recovered Items';
    else if (adminReturnUrl.includes('matches.html')) adminReturnLabel = '← Back to Matches';

    if (user && user.role === 'admin') {
      document.getElementById('admin-bar-area').innerHTML = `
        <div class="admin-context-bar" style="margin-top:20px;">
          <div class="flex gap-8" style="align-items:center;">
            <strong style="display:inline-flex; align-items:center; gap:6px;"><svg class="ui-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--burgundy-dark);"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Admin Inspector:</strong>
            <span>Report #${item.id} (${item.type.toUpperCase()}) &bull; Status: <span class="badge ${statusBadgeClass(item.status)}">${item.status}</span></span>
          </div>
          <div class="flex gap-8 flex-wrap">
            <a href="${adminReturnUrl}" class="btn btn-outline btn-xs">${adminReturnLabel}</a>
            <a href="/admin/dashboard.html" class="btn btn-primary btn-xs">Admin Overview</a>
          </div>
        </div>
      `;
    } else if (fromParamInit === 'dashboard') {
      document.getElementById('admin-bar-area').innerHTML = `
        <div style="margin-top:16px;">
          <a href="/dashboard.html?tab=${tabParamInit}" class="btn btn-outline btn-xs">← Back to Dashboard (${tabParamInit === 'found' ? 'Found Items' : (tabParamInit === 'claims' ? 'Claims' : 'Lost Items')})</a>
        </div>
      `;
    }

    const wrap = document.getElementById('item-detail');
    wrap.style.display = 'grid';

    const isOwner = user && user.id === item.user_id;
    const canClaim = user && item.type === 'found' && !isOwner && item.status === 'active';

    wrap.innerHTML = `
      <div>
        <div class="item-photo">${item.image ? `<img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)}">` : '<span>No photo provided</span>'}</div>
      </div>
      <div>
        <div class="flex gap-8 mb-16">
          <span class="badge ${item.type === 'lost' ? 'badge-lost' : 'badge-found'}">${item.type.toUpperCase()}</span>
          <span class="badge ${statusBadgeClass(item.status)}">${item.status}</span>
        </div>
        <h2>${escapeHtml(item.title)}</h2>
        <p>${escapeHtml(item.description || 'No further description provided.')}</p>
        <div class="meta-list">
          <div class="meta-row"><span class="k">Category</span><span>${escapeHtml(item.category)}</span></div>
          <div class="meta-row"><span class="k">Color</span><span>${escapeHtml(item.color || '—')}</span></div>
          <div class="meta-row"><span class="k">Brand</span><span>${escapeHtml(item.brand || '—')}</span></div>
          <div class="meta-row"><span class="k">Location</span><span>${escapeHtml(item.location)}</span></div>
          <div class="meta-row"><span class="k">Reported</span><span>${timeAgo(item.created_at)}</span></div>
          <div class="meta-row">
            <span class="k">Reporter</span>
            <span style="display:inline-flex; align-items:center; gap:8px;">
              ${item.reporter_avatar ? `<img src="${escapeHtml(item.reporter_avatar)}" alt="${escapeHtml(item.reporter_name || '')}" style="width:24px; height:24px; border-radius:50%; object-fit:cover; border:1px solid var(--line);">` : ''}
              <span>${escapeHtml(item.reporter_name || 'Anonymous')}${item.reporter_batch ? ` <span class="muted small">(Batch: ${escapeHtml(item.reporter_batch)}${item.reporter_section ? `, Sec: ${escapeHtml(item.reporter_section)}` : ''})</span>` : ''}</span>
            </span>
          </div>
          ${item.reporter_phone ? `<div class="meta-row"><span class="k">WhatsApp</span><span><a href="${formatWhatsAppUrl(item.reporter_phone)}" target="_blank" rel="noopener noreferrer" style="color:#25D366; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:6px;"><svg class="ui-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#25D366;"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg> ${escapeHtml(item.reporter_phone)}</a></span></div>` : ''}
          ${item.storage_location ? `<div class="meta-row"><span class="k">Being kept at</span><span>${escapeHtml(item.storage_location)}</span></div>` : ''}
        </div>
        <div class="flex gap-12 flex-wrap" id="actions"></div>
      </div>
    `;

    const urlParams = new URLSearchParams(window.location.search);
    const fromParam = urlParams.get('from');
    const tabParam = urlParams.get('tab') || sessionStorage.getItem('refind_dash_tab') || (item.type === 'found' ? 'found' : 'lost');
    const isAdminViewer = fromParam === 'admin' || (user && user.role === 'admin');

    const flyerUrl = isAdminViewer
      ? `/flyer.html?id=${item.id}&from=admin&returnUrl=${encodeURIComponent(window.location.href)}`
      : `/flyer.html?id=${item.id}&from=dashboard&tab=${tabParam}`;

    const receiptUrl = isAdminViewer
      ? `/receipt.html?itemId=${item.id}&from=admin&returnUrl=${encodeURIComponent(window.location.href)}`
      : `/receipt.html?itemId=${item.id}&from=dashboard&tab=${tabParam}`;

    const actions = document.getElementById('actions');
    const flyerBtn = `<a href="${flyerUrl}" target="_blank" class="btn btn-outline"><svg class="ui-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg> Print Flyer</a>`;
    const receiptBtn = (item.status === 'claimed' || item.status === 'resolved')
      ? `<a href="${receiptUrl}" target="_blank" class="btn btn-moss"><svg class="ui-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> Custody Receipt</a>`
      : '';
    const waContactBtn = (!isOwner && item.reporter_phone && item.status === 'active')
      ? whatsappButtonHtml(item.reporter_phone, `Hi, I am contacting you regarding your ${item.type} report for "${item.title}" on ReFind.`, 'Contact via WhatsApp', '')
      : '';

    if (canClaim) {
      actions.innerHTML = `
        <a href="/claim.html?itemId=${item.id}" class="btn btn-clay">Claim this item</a>
        ${waContactBtn}
        ${flyerBtn}
        ${receiptBtn}
      `;
    } else if (isOwner && item.status !== 'withdrawn') {
      const editLink = item.type === 'lost'
        ? `/report-lost.html?edit=${item.id}&from=${isAdminViewer ? 'admin' : 'dashboard'}&tab=${tabParam}`
        : `/report-found.html?edit=${item.id}&from=${isAdminViewer ? 'admin' : 'dashboard'}&tab=${tabParam}`;
      const matchLink = item.type === 'lost' ? `/matches.html?lostItemId=${item.id}` : `/matches.html?foundItemId=${item.id}`;
      actions.innerHTML = `
        <a href="${matchLink}" class="btn btn-primary">View potential matches</a>
        <a href="${editLink}" class="btn btn-outline">Edit</a>
        ${flyerBtn}
        ${receiptBtn}
        ${item.status === 'active' || item.status === 'matched' ? `<button class="btn btn-ghost" id="withdraw-btn">Withdraw</button>` : ''}
      `;
      const withdrawBtn = document.getElementById('withdraw-btn');
      if (withdrawBtn) withdrawBtn.addEventListener('click', () => withdrawThisItem(item.id));
    } else if (!user) {
      actions.innerHTML = `
        <a href="/login.html" class="btn btn-outline">Log in to claim or view matches</a>
        ${flyerBtn}
        ${receiptBtn}
      `;
    } else {
      actions.innerHTML = `
        ${waContactBtn}
        ${flyerBtn}
        ${receiptBtn}
      `;
    }
  }

  async function withdrawThisItem(id) {
    const ok = await confirmDialog({
      title: 'Withdraw this report?',
      body: 'This marks it as no longer active. It stops showing up in matches and search.',
      confirmLabel: 'Withdraw',
    });
    if (!ok) return;
    try {
      await api.post(`/items/${id}/withdraw`, {});
      toast('Report withdrawn.');
      load();
    } catch (err) {
      toast(err.message, 'error');
    }
  }

  load();
</script>
</body>
</html>
