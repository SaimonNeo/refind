<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgWallet" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#faf5ef"/>
      <stop offset="100%" stop-color="#dfd2c0"/>
    </radialGradient>
    <linearGradient id="leatherBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="40%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="innerLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <filter id="walletShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="2" dy="12" stdDeviation="14" flood-color="#451a03" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgWallet)"/>
  
  <!-- Floor shadow -->
  <ellipse cx="204" cy="260" rx="95" ry="14" fill="#2d1704" opacity="0.22"/>

  <!-- Leather Wallet Group slightly rotated -->
  <g transform="rotate(4 200 150)" filter="url(#walletShadow)">
    <!-- Back Leather Shell -->
    <rect x="105" y="70" width="190" height="150" rx="16" fill="url(#leatherBrown)" stroke="#451a03" stroke-width="2"/>

    <!-- Subtle Leather Stitching on Outer Edge -->
    <rect x="110" y="75" width="180" height="140" rx="12" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="3.5,3" opacity="0.75"/>

    <!-- Inner Flap / Pocket Divider -->
    <path d="M 105 130 C 130 135, 170 135, 195 125 L 195 220 L 105 220 Z" fill="url(#innerLeather)"/>
    <path d="M 110 135 C 130 140, 170 140, 190 130" fill="none" stroke="#d97706" stroke-width="1.4" stroke-dasharray="3,2.5" opacity="0.75"/>

    <!-- Right Side Card Slots -->
    <path d="M 205 125 C 230 135, 270 135, 295 130 L 295 220 L 205 220 Z" fill="url(#innerLeather)"/>
    <path d="M 210 130 C 230 140, 270 140, 290 135" fill="none" stroke="#d97706" stroke-width="1.4" stroke-dasharray="3,2.5" opacity="0.75"/>

    <!-- Credit / Transit Cards Peeking Out of Slots -->
    <!-- Gold Campus Card -->
    <rect x="115" y="92" width="70" height="40" rx="5" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
    <rect x="115" y="100" width="70" height="7" fill="#854d0e"/>
    <circle cx="170" cy="118" r="5" fill="#ca8a04"/>

    <!-- Teal Bank Card (Right Slot) -->
    <rect x="215" y="86" width="70" height="42" rx="5" fill="#0d9488" stroke="#0f766e" stroke-width="1"/>
    <rect x="222" y="95" width="16" height="12" rx="2" fill="#fef08a" stroke="#ca8a04" stroke-width="0.6"/>
    <text x="278" y="120" font-family="-apple-system, sans-serif" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="end">VISA</text>

    <!-- Center Fold Crease -->
    <line x1="200" y1="70" x2="200" y2="220" stroke="#260e02" stroke-width="2.5" opacity="0.8"/>
  </g>
</svg>
