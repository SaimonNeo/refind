<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgCalc" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <linearGradient id="bodySilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="lcdG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="calcShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="2" dy="12" stdDeviation="14" flood-color="#1e293b" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgCalc)"/>
  
  <!-- Subtle floor shadow -->
  <ellipse cx="200" cy="268" rx="85" ry="14" fill="#0f172a" opacity="0.2"/>

  <!-- Calculator Group -->
  <g transform="rotate(3 200 150)" filter="url(#calcShadow)">
    <!-- Side Rubber Grip Bumpers -->
    <rect x="135" y="42" width="130" height="216" rx="20" fill="#1e293b"/>

    <!-- Main Silver Front Casing -->
    <rect x="140" y="42" width="120" height="216" rx="18" fill="url(#bodySilver)" stroke="#64748b" stroke-width="1.5"/>

    <!-- Brand & Model Name -->
    <text x="150" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="800" fill="#0f172a" letter-spacing="0.5">CASIO</text>
    <text x="210" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="6" font-weight="600" fill="#475569">fx-991ES PLUS</text>

    <!-- Solar Panel Strip -->
    <rect x="228" y="51" width="24" height="8" rx="1.5" fill="#3f2e1a" stroke="#78350f" stroke-width="0.8"/>
    <line x1="236" y1="51" x2="236" y2="59" stroke="#78350f" stroke-width="0.6"/>
    <line x1="244" y1="51" x2="244" y2="59" stroke="#78350f" stroke-width="0.6"/>

    <!-- LCD Dot-Matrix Display Screen -->
    <rect x="148" y="65" width="104" height="38" rx="4" fill="url(#lcdG)" stroke="#0f172a" stroke-width="1.8"/>
    <!-- Screen Text -->
    <text x="152" y="78" font-family="Courier, monospace" font-size="7.5" font-weight="bold" fill="#064e3b">D  Math ▲</text>
    <text x="152" y="93" font-family="Courier, monospace" font-size="11" font-weight="bold" fill="#064e3b">∫[2x + sin(θ)]</text>
    <text x="246" y="98" font-family="Courier, monospace" font-size="11" font-weight="bold" fill="#064e3b" text-anchor="end">= 4.281</text>

    <!-- Center Navigation Wheel (Casio Oval Button) -->
    <ellipse cx="200" cy="116" rx="14" ry="9" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1"/>
    <circle cx="200" cy="116" r="4" fill="#1e3a8a"/>

    <!-- Function Keys (Shift, Alpha, Mode, On) -->
    <rect x="150" y="110" width="12" height="7" rx="2" fill="#ca8a04"/>
    <rect x="166" y="110" width="12" height="7" rx="2" fill="#dc2626"/>
    <rect x="222" y="110" width="12" height="7" rx="2" fill="#1e293b"/>
    <rect x="238" y="110" width="12" height="7" rx="2" fill="#1e293b"/>

    <!-- Scientific Function Keys Row 1 -->
    <g fill="#334155" rx="1.5">
      <rect x="150" y="125" width="12" height="7" rx="1.5"/>
      <rect x="168" y="125" width="12" height="7" rx="1.5"/>
      <rect x="186" y="125" width="12" height="7" rx="1.5"/>
      <rect x="204" y="125" width="12" height="7" rx="1.5"/>
      <rect x="222" y="125" width="12" height="7" rx="1.5"/>
      <rect x="238" y="125" width="12" height="7" rx="1.5"/>
      
      <!-- Scientific Row 2 (sin, cos, tan, etc.) -->
      <rect x="150" y="137" width="12" height="7" rx="1.5"/>
      <rect x="168" y="137" width="12" height="7" rx="1.5"/>
      <rect x="186" y="137" width="12" height="7" rx="1.5"/>
      <rect x="204" y="137" width="12" height="7" rx="1.5"/>
      <rect x="222" y="137" width="12" height="7" rx="1.5"/>
      <rect x="238" y="137" width="12" height="7" rx="1.5"/>
    </g>

    <!-- Keypad Separator Line -->
    <line x1="146" y1="150" x2="254" y2="150" stroke="#94a3b8" stroke-width="1"/>

    <!-- Numeric Keypad Grid (Light Grey Keys) -->
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8">
      <!-- Row 7, 8, 9, DEL, AC -->
      <rect x="150" y="156" width="16" height="13" rx="2.5"/>
      <rect x="171" y="156" width="16" height="13" rx="2.5"/>
      <rect x="192" y="156" width="16" height="13" rx="2.5"/>
      <rect x="213" y="156" width="16" height="13" rx="2.5" fill="#3b82f6"/>
      <rect x="234" y="156" width="16" height="13" rx="2.5" fill="#ef4444"/>

      <!-- Row 4, 5, 6, *, / -->
      <rect x="150" y="174" width="16" height="13" rx="2.5"/>
      <rect x="171" y="174" width="16" height="13" rx="2.5"/>
      <rect x="192" y="174" width="16" height="13" rx="2.5"/>
      <rect x="213" y="174" width="16" height="13" rx="2.5" fill="#475569"/>
      <rect x="234" y="174" width="16" height="13" rx="2.5" fill="#475569"/>

      <!-- Row 1, 2, 3, +, - -->
      <rect x="150" y="192" width="16" height="13" rx="2.5"/>
      <rect x="171" y="192" width="16" height="13" rx="2.5"/>
      <rect x="192" y="192" width="16" height="13" rx="2.5"/>
      <rect x="213" y="192" width="16" height="13" rx="2.5" fill="#475569"/>
      <rect x="234" y="192" width="16" height="13" rx="2.5" fill="#475569"/>

      <!-- Bottom Row: 0, ., x10^x, Ans, = -->
      <rect x="150" y="210" width="16" height="13" rx="2.5"/>
      <rect x="171" y="210" width="16" height="13" rx="2.5"/>
      <rect x="192" y="210" width="16" height="13" rx="2.5"/>
      <rect x="213" y="210" width="16" height="13" rx="2.5"/>
      <rect x="234" y="210" width="16" height="13" rx="2.5" fill="#1e293b"/>
    </g>

    <!-- Numeric Key Labels -->
    <text x="158" y="165" font-family="-apple-system, sans-serif" font-size="8" font-weight="bold" fill="#0f172a" text-anchor="middle">7</text>
    <text x="179" y="165" font-family="-apple-system, sans-serif" font-size="8" font-weight="bold" fill="#0f172a" text-anchor="middle">8</text>
    <text x="200" y="165" font-family="-apple-system, sans-serif" font-size="8" font-weight="bold" fill="#0f172a" text-anchor="middle">9</text>
    <text x="221" y="165" font-family="-apple-system, sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">DEL</text>
    <text x="242" y="165" font-family="-apple-system, sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">AC</text>
  </g>
</svg>
