<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgAudio" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#faf9f7"/>
      <stop offset="100%" stop-color="#dedad4"/>
    </radialGradient>
    <linearGradient id="whiteShell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="silverTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="headphoneShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="2" dy="12" stdDeviation="15" flood-color="#1e1810" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgAudio)"/>
  
  <!-- Floor shadow -->
  <ellipse cx="200" cy="265" rx="90" ry="14" fill="#18140e" opacity="0.18"/>

  <!-- Headphones Group -->
  <g filter="url(#headphoneShadow)">
    <!-- Outer Headband Arch -->
    <path d="M 125 170 C 115 75, 285 75, 275 170" fill="none" stroke="url(#whiteShell)" stroke-width="18" stroke-linecap="round"/>
    <!-- Headband Inner Cushion Pad -->
    <path d="M 140 145 C 135 90, 265 90, 260 145" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Adjustable Metal Slider Extenders -->
    <rect x="114" y="152" width="10" height="25" rx="3" fill="url(#silverTrim)" stroke="#94a3b8" stroke-width="1"/>
    <rect x="276" y="152" width="10" height="25" rx="3" fill="url(#silverTrim)" stroke="#94a3b8" stroke-width="1"/>

    <!-- Left Ear Cup Assembly -->
    <g transform="translate(118, 195) rotate(8)">
      <!-- Plush Cushion -->
      <ellipse cx="-4" cy="0" rx="16" ry="34" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
      <ellipse cx="-4" cy="0" rx="10" ry="24" fill="#f1f5f9"/>
      <!-- Outer Dome Shell -->
      <ellipse cx="6" cy="0" rx="18" ry="32" fill="url(#whiteShell)" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Subtle Brand Logo Accent (Sony style) -->
      <text x="8" y="3" font-family="-apple-system, sans-serif" font-size="6" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">SONY</text>
    </g>

    <!-- Right Ear Cup Assembly -->
    <g transform="translate(282, 195) rotate(-8)">
      <!-- Plush Cushion -->
      <ellipse cx="4" cy="0" rx="16" ry="34" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
      <ellipse cx="4" cy="0" rx="10" ry="24" fill="#f1f5f9"/>
      <!-- Outer Dome Shell -->
      <ellipse cx="-6" cy="0" rx="18" ry="32" fill="url(#whiteShell)" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Subtle Brand Logo Accent -->
      <text x="-8" y="3" font-family="-apple-system, sans-serif" font-size="6" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">SONY</text>
    </g>
  </g>
</svg>
