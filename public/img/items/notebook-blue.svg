<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBook" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#faf5ec"/>
      <stop offset="100%" stop-color="#dfd6c6"/>
    </radialGradient>
    <linearGradient id="coverBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="40%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="wireG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="bookShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="3" dy="12" stdDeviation="14" flood-color="#1e293b" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgBook)"/>
  
  <!-- Floor shadow -->
  <ellipse cx="204" cy="265" rx="100" ry="14" fill="#2d2215" opacity="0.2"/>

  <!-- Spiral Notebook Group -->
  <g transform="rotate(-3 200 150)" filter="url(#bookShadow)">
    <!-- Cream Paper Edge Stack Peeking on the Right and Bottom -->
    <rect x="135" y="48" width="155" height="206" rx="8" fill="#fefce8" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="132" y="46" width="155" height="206" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Main Front Blue Poly Cover -->
    <rect x="130" y="44" width="152" height="206" rx="8" fill="url(#coverBlue)" stroke="#172554" stroke-width="2"/>

    <!-- Subtle Geometric Accent Grid on Cover -->
    <line x1="150" y1="44" x2="150" y2="250" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
    <line x1="130" y1="90" x2="282" y2="90" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
    <line x1="130" y1="200" x2="282" y2="200" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>

    <!-- White Subject Label Tag in Center -->
    <rect x="156" y="115" width="105" height="65" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="162" y1="138" x2="255" y2="138" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="162" y1="156" x2="255" y2="156" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="162" y1="172" x2="255" y2="172" stroke="#cbd5e1" stroke-width="1"/>

    <text x="208" y="132" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" fill="#1e3a8a" text-anchor="middle" letter-spacing="0.6">CAMPUS NOTES</text>
    <text x="165" y="152" font-family="Comic Sans MS, cursive, sans-serif" font-size="8.5" font-weight="bold" fill="#0f172a">Chemistry 101</text>
    <text x="165" y="169" font-family="-apple-system, sans-serif" font-size="7" font-weight="600" fill="#64748b">Lectures &amp; Lab Notes</text>

    <!-- Spiral Wire Binding along Left Edge -->
    <g transform="translate(122, 54)">
      <!-- Repeated Spiral Rings -->
      <g fill="none" stroke="url(#wireG)" stroke-width="3" stroke-linecap="round">
        <path d="M 0 0 C 14 -4, 14 10, 0 10"/>
        <path d="M 0 16 C 14 12, 14 26, 0 26"/>
        <path d="M 0 32 C 14 28, 14 42, 0 42"/>
        <path d="M 0 48 C 14 44, 14 58, 0 58"/>
        <path d="M 0 64 C 14 60, 14 74, 0 74"/>
        <path d="M 0 80 C 14 76, 14 90, 0 90"/>
        <path d="M 0 96 C 14 92, 14 106, 0 106"/>
        <path d="M 0 112 C 14 108, 14 122, 0 122"/>
        <path d="M 0 128 C 14 124, 14 138, 0 138"/>
        <path d="M 0 144 C 14 140, 14 154, 0 154"/>
        <path d="M 0 160 C 14 156, 14 170, 0 170"/>
        <path d="M 0 176 C 14 172, 14 186, 0 186"/>
      </g>
      <!-- Punched Hole Dots -->
      <g fill="#0f172a">
        <circle cx="8" cy="5" r="2.5"/>
        <circle cx="8" cy="21" r="2.5"/>
        <circle cx="8" cy="37" r="2.5"/>
        <circle cx="8" cy="53" r="2.5"/>
        <circle cx="8" cy="69" r="2.5"/>
        <circle cx="8" cy="85" r="2.5"/>
        <circle cx="8" cy="101" r="2.5"/>
        <circle cx="8" cy="117" r="2.5"/>
        <circle cx="8" cy="133" r="2.5"/>
        <circle cx="8" cy="149" r="2.5"/>
        <circle cx="8" cy="165" r="2.5"/>
        <circle cx="8" cy="181" r="2.5"/>
      </g>
    </g>
  </g>
</svg>
